<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Tchokponhoue Ezechiel</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="https://res.cloudinary.com/nyke7lhc/image/upload/v1785027102/image_0_bm09fx.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="logo-row">
      <img src="https://res.cloudinary.com/nyke7lhc/image/upload/v1785027102/image_0_bm09fx.png" alt="Logo Ezechiel Design">
    </div>
    <h1>Content de vous revoir</h1>
    <p class="sub">Connectez-vous pour accéder à votre tableau de bord</p>

    <div id="login-error" class="error-msg"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="votre@email.com">
      </div>
      <div class="form-group">
        <label for="login-password">Mot de passe</label>
        <input type="password" id="login-password" placeholder="Votre mot de passe">
      </div>
      <button type="submit" class="btn btn-primary">Se connecter</button>
    </form>

    <div class="auth-footer">
      Pas encore de compte ? <a href="signup.html">S'inscrire</a>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
